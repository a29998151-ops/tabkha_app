<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><link rel="manifest" href="./manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طبخة النهاردة - مساعد المطبخ الذكي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .hero-gradient { background: linear-gradient(135deg, #FF6B00 0%, #FF9E00 100%); }
    .custom-shadow { box-shadow: 0 10px 25px -5px rgba(255, 107, 0, 0.2); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

  <header class="bg-white border-b border-slate-100 sticky top-0 z-40 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-orange-200">
          <i class="fa-solid fa-utensils"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg text-slate-900 leading-tight">طبخة النهاردة</h1>
          <p class="text-xs text-orange-600 font-medium">مساعد المطبخ الذكي</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-full border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Gemini AI متصل
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-6">
    <div class="hero-gradient rounded-3xl p-5 text-white custom-shadow relative overflow-hidden">
      <h2 class="text-2xl font-extrabold mb-2 leading-tight">محتار تطبخ إيه النهاردة؟</h2>
      <p class="text-xs text-orange-50 leading-relaxed mb-5 font-medium">اكتب اللي عندك في الثلاجة، وسيب الباقي للشيف الذكي!</p>

      <div class="space-y-3">
        <div class="relative">
          <input type="text" id="ingredientsInput" placeholder="مثال: دجاج، بصل، طماطم، بطاطس..." class="w-full bg-white text-slate-800 placeholder-slate-400 text-xs rounded-2xl px-4 py-3.5 pl-10 focus:outline-none font-medium shadow-sm">
          <i class="fa-solid fa-kitchen-set absolute left-3 top-3.5 text-slate-400 text-sm"></i>
        </div>
      </div>

      <button onclick="generateRecipe()" id="submitBtn" class="w-full mt-4 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 transition text-sm">
        <i class="fa-solid fa-wand-magic-sparkles text-orange-400"></i>
        اقترح لي طبخة النهاردة ✨
      </button>
    </div>

    <div id="loadingBox" class="hidden text-center py-8 space-y-3">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-orange-500 border-t-transparent"></div>
      <p class="text-xs font-bold text-slate-600">جاري التفكير في أفضل وصفة تناسب مكوناتك...</p>
    </div>

    <div id="resultBox" class="hidden bg-white rounded-3xl p-5 border border-slate-100 shadow-sm space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 id="recipeTitle" class="text-lg font-extrabold text-slate-900"></h3>
        <span id="recipeTime" class="text-xs font-bold bg-orange-100 text-orange-700 px-2.5 py-1 rounded-full"></span>
      </div>
      <div>
        <h4 class="font-bold text-xs text-orange-600 mb-2">المكونات المطلوبة:</h4>
        <ul id="recipeIngredients" class="list-disc list-inside text-xs text-slate-600 space-y-1 font-medium pl-2"></ul>
      </div>
      <div>
        <h4 class="font-bold text-xs text-orange-600 mb-2">خطوات التحضير:</h4>
        <ol id="recipeSteps" class="list-decimal list-inside text-xs text-slate-600 space-y-1.5 font-medium pl-2"></ol>
      </div>
    </div>
  </main>

  <script>
    async function generateRecipe() {
      // تم دمج مفتاحك الصحيح هنا مباشرة
      const apiKey = "AIzaSyBqMMiyeECWl4UjsrwcgVL0hcBLBSVcN6E"; 
      const inputVal = document.getElementById('ingredientsInput').value;
      
      if (!inputVal) {
        alert('يرجى كتابة المكونات أولاً!');
        return;
      }

      const loadingBox = document.getElementById('loadingBox');
      const resultBox = document.getElementById('resultBox');
      
      loadingBox.classList.remove('hidden');
      resultBox.classList.add('hidden');

      try {
        const promptText = "اقترح وصفة طعام عربية تناسب المكونات التالية وأعطني النتيجة بصيغة JSON فقط بهذا الشكل تماماً:\n" +
          "{\n  \"title\": \"اسم الوصفة\",\n  \"time\": \"30 دقيقة\",\n  \"ingredients\": [\"مكون 1\", \"مكون 2\"],\n  \"steps\": [\"خطوة 1\", \"خطوة 2\"]\n}\nمكوناتي هي: " + inputVal;

        const bodyData = { contents: [{ parts: [{ text: promptText }] }] };

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const textResponse = data.candidates[0].content.parts[0].text;
        
        let recipe;
        try {
          const cleanJson = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
          const jsonStart = cleanJson.indexOf('{');
          const jsonEnd = cleanJson.lastIndexOf('}') + 1;
          recipe = JSON.parse(cleanJson.substring(jsonStart, jsonEnd));
        } catch (e) {
          recipe = {
            title: "وصفة الشيف الذكي",
            time: "30 دقيقة",
            ingredients: [inputVal],
            steps: [textResponse]
          };
        }

        document.getElementById('recipeTitle').innerText = recipe.title || 'وصفة مقترحة';
        document.getElementById('recipeTime').innerText = recipe.time || '30 دقيقة';

        const ingList = document.getElementById('recipeIngredients');
        ingList.innerHTML = '';
        (recipe.ingredients || []).forEach(item => {
          const li = document.createElement('li');
          li.innerText = item;
          ingList.appendChild(li);
        });

        const stepsList = document.getElementById('recipeSteps');
        stepsList.innerHTML = '';
        (recipe.steps || []).forEach(step => {
          const li = document.createElement('li');
          li.innerText = step;
          stepsList.appendChild(li);
        });

        resultBox.classList.remove('hidden');
      } catch (err) {
        alert('حدث خطأ أثناء الاتصال بالذكاء الاصطناعي.');
        console.error(err);
      } finally {
        loadingBox.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
